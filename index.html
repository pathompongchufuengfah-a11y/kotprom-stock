<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โคตรพร้อม สต็อก</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ธีมโคตรพร้อม (kotprom/THEME.md): ส้มนำ ขาวรอง · ฟอนต์ไทยมีหัว · ปุ่มใหญ่กดยุบ
     สีเขียว/เหลือง/แดง ใช้บอกความหมายเท่านั้น · ทุกร้านใช้ธีมเดียวกัน ต่างแค่ชื่อร้าน */
  :root {
    --bg: #FFF9F3; --card: #ffffff; --ink: #21140D; --muted: #5E4B3F; --line: #F0E2D5;
    --brand: #EA580C; --brand-ink: #C2410C; --brand-edge: #9A3412; --brand-soft: #FFE8D4; --brand-50: #FFF5EC; --brand-500: #F97316;
    --ok: #157A3A; --ok-soft: #E2F7E8; --warn: #8A5A00; --warn-soft: #FFF2CC;
    --bad: #B42318; --bad-soft: #FDE7E4; --night: #21140D;
    --r: 26px; --shadow: 0 2px 0 #F0E2D5, 0 12px 24px -14px rgba(124,45,18,.22);
    --display: "Mali", "Noto Sans Thai Looped", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Thai Looped", "Sukhumvit Set", "Leelawadee UI", sans-serif; font-size: 19px; line-height: 1.55; }
  body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }
  header { padding: 18px 20px 6px; max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; gap: 12px; }
  header .who { flex: 1; min-width: 0; }
  header .shop { color: var(--muted); font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .mark { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-500); display: grid; place-items: center; flex: none; align-self: center; }
  header .mark .nong .m-speed { stroke: #FFE0C2; }
  header h1 { font-family: var(--display); margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding: 10px 16px 0; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--display); margin: 0 0 10px; font-size: 21px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 16px; }
  .center { text-align: center; }
  .hero { text-align: center; padding: 22px 20px 20px; }
  .hero .hm { line-height: 0; margin-bottom: 6px; }
  .hero.orange { background: var(--brand-500); border-color: var(--brand-500); }
  .hero.orange .nong .m-speed { stroke: #FFE0C2; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; background: #f1efea; font-size: 17px; font-weight: 600; }
  .status.ok { background: var(--ok-soft); color: var(--ok); } .status.warn { background: var(--warn-soft); color: var(--warn); } .status.bad { background: var(--bad-soft); color: var(--bad); }
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; color: inherit; background: none; }
  .btn { display: block; width: 100%; min-height: 88px; padding: 14px 18px; border-radius: var(--r); margin-bottom: 6px;
    background: var(--brand); color: #fff; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.2;
    box-shadow: 0 6px 0 var(--brand-edge); transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--brand-edge); }
  .btn small { display: block; font-family: "Noto Sans Thai Looped", sans-serif; font-size: 18px; font-weight: 600; margin-top: 4px; }
  .btn.quiet { background: #fff; color: var(--brand-ink); border: 3px solid #FFD0A8; box-shadow: 0 6px 0 #FFD0A8; min-height: 66px; font-size: 22px; }
  .btn.quiet small { font-size: 16px; color: var(--muted); }
  .btn.confirm, .btn.quiet.confirm { background: repeating-linear-gradient(-45deg, #B42318 0 18px, #9C1D13 18px 36px); color: #fff; border-color: #B42318; box-shadow: 0 6px 0 #7A1810; }
  .btn[disabled] { opacity: .45; box-shadow: none; }
  .small-btn { min-height: 48px; padding: 8px 18px; border-radius: 16px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 var(--brand-edge); }
  .small-btn.ghost { background: #fff; color: var(--brand-ink); border: 2px solid #FFD0A8; box-shadow: 0 3px 0 #FFD0A8; }
  .small-btn.red { background: #fff; color: var(--bad); border: 2px solid #f3c4bf; box-shadow: 0 3px 0 #f3c4bf; }
  .small-btn.red.confirm { background: var(--bad); color: #fff; }
  .small-btn[disabled] { opacity: .45; }
  .gap { height: 18px; }
  .note { border-radius: 16px; padding: 12px 16px; margin-top: 12px; font-size: 17px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); } .note.ok { background: var(--ok-soft); color: var(--ok); } .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.brand { background: var(--brand-50); color: var(--brand-edge); }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 4px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; max-width: 120px; min-height: 64px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 0 2px; position: relative; }
  nav.tabs button svg { display: block; margin: 0 auto 2px; width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { background: var(--brand-soft); color: var(--brand-edge); }
  nav.tabs .badge { position: absolute; top: 4px; right: 14px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 13px; line-height: 22px; }
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg button { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; padding: 6px 2px; white-space: nowrap; }
  .seg button.on, .grid3 button.on, .chips button.on { border-color: var(--brand); background: var(--brand-50); color: var(--brand-edge); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .grid3 button { min-height: 52px; border-radius: 14px; background: #fff; border: 2px solid var(--line); font-size: 16px; font-weight: 700; padding: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { min-height: 48px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 16px; font-weight: 700; }
  .chips button i { font-style: normal; font-weight: 600; color: var(--muted); font-size: 14px; }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; font-size: 18px; }
  .item .sub { color: var(--muted); font-size: 15px; }
  .item .amt { text-align: right; font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; }
  .item .amt small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 12px; border-top: 2px solid var(--line); font-weight: 700; font-size: 20px; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #f1efea; color: var(--muted); vertical-align: 1px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.brand { background: var(--brand-soft); color: var(--brand-edge); }
  input, select, textarea { font: inherit; font-size: 19px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); min-height: 52px; max-width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { width: 100%; min-height: 140px; line-height: 1.6; resize: vertical; font-size: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label, .field .lb { font-weight: 700; font-size: 18px; }
  .field input, .field select { width: 100%; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .two .field { margin-bottom: 10px; }
  pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 17px; line-height: 1.7; margin: 0; }
  /* ปุ่มจำนวน −/+ ใหญ่ มือเปียกก็กดได้ */
  .step { display: flex; align-items: center; gap: 6px; flex: none; }
  .step button { width: 52px; height: 52px; border-radius: 16px; background: var(--brand-50); border: 2px solid #FFD0A8; color: var(--brand-ink); font-size: 28px; font-weight: 800; line-height: 1; }
  .step input { width: 84px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 8px 4px; }
  .step input.done { border-color: var(--brand); background: var(--brand-50); }
  .citem { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .citem:last-child { border-bottom: 0; }
  .citem .main { flex: 1; min-width: 0; }
  .citem .name { font-weight: 700; font-size: 18px; line-height: 1.3; }
  .citem .sub { color: var(--muted); font-size: 15px; }
  .rline { border: 2px solid var(--line); border-radius: 20px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
  .rline .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rline .top b { flex: 1; min-width: 0; font-size: 18px; }
  .rline .x { width: 44px; height: 44px; border-radius: 14px; border: 2px solid #F5C2BB; color: var(--bad); font-size: 18px; font-weight: 800; flex: none; }
  .rline .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .rline label { font-size: 14px; font-weight: 700; color: var(--muted); display: block; }
  .rline input { width: 100%; text-align: right; font-weight: 700; }
  .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .types.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .types button { min-height: 72px; border-radius: 20px; border: 2px solid var(--line); background: #fff; text-align: left; padding: 10px 14px; font-weight: 700; font-size: 18px; line-height: 1.25; }
  .types.three button { text-align: center; padding: 8px 4px; font-size: 17px; }
  .types button small { display: block; font-weight: 600; font-size: 14px; color: var(--muted); }
  .types button.on { border: 3px solid var(--brand); background: var(--brand-50); }
  .stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat3 div { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 10px 10px; }
  .stat3 b { display: block; font-family: var(--display); font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; word-break: break-all; }
  .stat3 span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .big { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pick button { min-height: 64px; border-radius: 20px; background: #fff; border: 2px solid var(--line); font-size: 19px; font-weight: 700; text-align: left; padding: 8px 14px; line-height: 1.25; }
  .pick button.on { border: 3px solid var(--brand); background: var(--brand-50); }
  .pick button[disabled] { opacity: .55; border-style: dashed; }
  .pick button small { display: block; font-size: 15px; font-weight: 600; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .steps i { height: 8px; border-radius: 99px; background: #EADCCF; } .steps i.on { background: var(--brand); }
  .stepname { color: var(--brand-ink); font-weight: 700; font-size: 17px; margin-bottom: 10px; }
  .bigcode { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: 3px; }
  .qr { width: 168px; height: 168px; padding: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; flex: none; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
  .ck { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 2px solid var(--line); font-size: 18px; }
  .ck:last-child { border-bottom: 0; }
  .ck b.n { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; font-family: var(--display); }
  .ck code { background: var(--brand-50); border-radius: 8px; padding: 1px 6px; font-weight: 700; }
  .tg { display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 2px solid var(--line); }
  .tg:last-child { border-bottom: 0; }
  .tg span { flex: 1; font-weight: 700; } .tg small { display: block; font-weight: 500; color: var(--muted); font-size: 16px; }
  .sw { appearance: none; -webkit-appearance: none; width: 64px; height: 38px; min-height: 0; padding: 0; border: 0; border-radius: 99px; background: #D8C8BB; position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .15s; }
  .sw:checked { background: var(--ok); } .sw:checked::after { left: 30px; }
  .adminbtn { min-height: 48px; padding: 6px 14px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; align-self: center; }
  .more { display: flex; justify-content: flex-end; margin-top: 10px; } .more.center { justify-content: center; }
  .more-btn { min-width: 48px; min-height: 48px; padding: 0 14px; border-radius: 24px; background: #fff; border: 2px solid var(--line);
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700; }
  .more-btn svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .more-btn.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-edge); }
  .more-box { margin-top: 10px; padding: 12px; border-radius: 20px; background: #fff; border: 2px dashed #FFD0A8; }
  .more-box > .card:last-child { margin-bottom: 0; }
  .results button { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 56px; padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 700; font-size: 18px; }
  .results button:last-child { border-bottom: 0; }
  .results button span { flex: 1; } .results button small { color: var(--muted); font-weight: 500; font-size: 15px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 9; max-width: 536px; margin: 0 auto;
    display: none; padding: 16px 18px; border-radius: 20px; background: var(--ink); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #toast.ok { background: #14532d; } #toast.bad { background: #7f1d1d; } #toast.warn { background: #78350f; }
  .loading { text-align: center; padding: 30px 20px 26px; }
  .loading .bowl { min-height: 76px; line-height: 0; display: inline-block; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; transform-origin: 50% 100%; }
  .loading .shadow { width: 54px; height: 8px; margin: 2px auto 0; border-radius: 50%; background: rgba(0,0,0,.08); animation: squish 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  .loading .msg { margin-top: 12px; color: var(--muted); font-size: 17px; font-weight: 600; min-height: 1.6em; }
  .loading .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--brand); animation: blink 1.2s infinite ease-in-out; }
  .loading .dots span:nth-child(2) { animation-delay: .15s; } .loading .dots span:nth-child(3) { animation-delay: .3s; }
  .skel { height: 64px; border-radius: var(--r); margin-bottom: 14px; background: linear-gradient(90deg, #ece9e2 0%, #f8f6f1 40%, #ece9e2 80%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; }
  .skel.s2 { height: 120px; } .skel.s3 { height: 88px; opacity: .7; }
  .nong .m-body { fill: #fff; stroke: #21140D; stroke-width: 4.5; stroke-linejoin: round; }
  .nong .m-speed { fill: none; stroke: #FDB27A; stroke-width: 6; stroke-linecap: round; }
  .nong .m-cheek { fill: #FDB27A; }
  .nong .m-eye { fill: none; stroke: #21140D; stroke-width: 7.5; stroke-linecap: round; }
  .nong .m-line { fill: none; stroke: #21140D; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .nong .m-drop { fill: #8FD3F4; stroke: #21140D; stroke-width: 3; }
  .nong .m-solid { fill: #21140D; stroke: #21140D; stroke-width: 4; stroke-linejoin: round; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06,.94); } 45% { transform: translateY(-22px) scale(.96,1.04) rotate(-6deg); } 60% { transform: translateY(-22px) rotate(6deg); } }
  @keyframes squish { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.55); opacity: .5; } }
  @keyframes blink { 0%,80%,100% { transform: scale(.6); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .btn[disabled] .busy::after { content: '…'; display: inline-block; width: 1.2em; text-align: left; animation: blink 1.2s infinite; }
  @media (prefers-reduced-motion: reduce) { .loading .bowl, .loading .shadow, .loading .dots span, .skel { animation: none; } }
  /* ตาราง (รายงาน/ประวัติ): เลื่อนในการ์ด ไม่ทำให้ทั้งหน้าเลื่อนแนวนอน */
  .tblwrap { overflow-x: auto; margin: 0 -8px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 16px; }
  .tbl th { text-align: left; color: var(--muted); font-size: 14px; font-weight: 700; padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: 0; }
  .bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
  .bar.warn i { background: #e0a100; } .bar.bad i { background: var(--bad); }
  .photo { display: block; width: 100%; max-height: 220px; object-fit: contain; border-radius: 16px; border: 2px solid var(--line); margin-top: 10px; background: var(--brand-50); }
  .flow { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
  .flow:last-child { border-bottom: 0; } .flow.sum { border-top: 2px solid var(--line); border-bottom: 0; font-weight: 700; font-size: 20px; padding-top: 10px; }
  #print { display: none; }
  /* ---------- คอมพิวเตอร์: เมนูด้านซ้าย · ใช้พื้นที่กว้าง · ปุ่มยังใหญ่พอ ---------- */
  @media (min-width: 900px) {
    body.hasnav { padding-left: 232px; padding-bottom: 32px; }
    header, main { max-width: 1120px; }
    main { padding: 10px 28px 0; }
    nav.tabs { top: 0; right: auto; width: 216px; flex-direction: column; justify-content: flex-start; gap: 6px;
      border-top: 0; border-right: 1px solid var(--line); padding: 100px 12px 16px; }
    nav.tabs button { flex: none; max-width: none; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 17px; text-align: left; }
    nav.tabs button svg { margin: 0; flex: none; }
    nav.tabs .badge { position: static; margin-left: auto; }
    #toast { left: auto; right: 28px; bottom: 28px; width: 440px; margin: 0; }
    .btn { min-height: 72px; font-size: 26px; }
    .wide { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; align-items: start; }

<body>
<header>
  <span class="mark" id="mark"></span>
  <div class="who"><div class="shop" id="title">โคตรพร้อม สต็อก</div><h1 id="who">กำลังเปิด…</h1></div>
  <button class="adminbtn" id="adminBtn" hidden>แอดมิน</button>
</header>
<main id="app"><div class="loading"><div class="bowl"></div><div class="shadow"></div><div class="msg">น้องพร้อมวิ่งมาแล้วน้า~</div><div class="dots"><span></span><span></span><span></span></div></div><div class="skel s2"></div><div class="skel"></div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="toast"></div>
<div id="print"></div>

<script>
'use strict';
// ★ วางไฟล์นี้บน GitHub Pages: แก้แค่ API_URL บรรทัดเดียว = URL ของ Apps Script (…/exec) · ทุกร้านใช้ไฟล์นี้ไฟล์เดียว
//   ลิงก์ของแต่ละร้าน = https://liff.line.me/<LIFF_ID>?shop=<รหัสร้าน> (ระบบสร้างให้ตอนสร้างร้าน)
const API_URL = "https://script.google.com/macros/s/AKfycbyX25e3Jt7YxBHXmgnBNuFiLgsfyCLFdsu3kUnMAm3eBNcBkqQlDY3jjpML_770rs9SLA/exec";
let LIFF_ID = '__LIFF_ID__';

let S = null, NO_SHOP = null, IS_ADMIN = false, idToken = '';
let tab = 'count', bossTab = 'sum';
let busy = {}, armed = '', armTimer = null;
let SHOP = shopFromUrl();

function shopFromUrl() {
  const clean = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  try {
    const q = new URLSearchParams(location.search);
    let v = q.get('shop');
    if (!v && q.get('liff.state')) v = new URLSearchParams(String(q.get('liff.state')).replace(/^[^?]*\?/, '')).get('shop');
    if (v) { localStorage.setItem('kps.shop', clean(v)); return clean(v); }
    return clean(localStorage.getItem('kps.shop'));
  } catch (e) { return ''; }
}
function rememberShop(id) { SHOP = id || ''; try { if (SHOP) localStorage.setItem('kps.shop', SHOP); else localStorage.removeItem('kps.shop'); } catch (e) {} }
function store(k, v) { try { if (v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v === null ? d : v; } catch (e) { return d; } }

// ---------- น้องพร้อม (THEME.md ข้อ 3–4) ----------
const NONG_PROM = {
  load:    ['น้องพร้อมวิ่งมาแล้วน้า~', 'แป๊บนึงน้า กำลังเตรียมให้', 'ยืดเส้นยืดสายแป๊บ…', 'พร้อมแล้ว พร้อมลุย!', 'รอแป๊บเดียว จะไวกว่าแสงเลย', 'เกือบเสร็จแล้วน้า~'],
  ok:      ['เก่งมาก!', 'เย้~ เรียบร้อย', 'วันนี้ก็สู้ๆ นะ', 'น้องพร้อมจดให้แล้วน้า'],
  error:   ['อุ๊ย สะดุดนิดนึง แตะอีกทีน้า', 'ไม่เป็นไรน้า ลองใหม่อีกครั้งนะ'],
  offline: ['เน็ตหายไปไหนน้า~ ลองใหม่อีกทีนะ'],
  empty:   ['ยังไม่มีอะไรเลย สบายๆ~']
};
const NONG_MOOD = ['happy', 'search', 'wink', 'search'];
function nong(kind) { const a = NONG_PROM[kind] || NONG_PROM.ok; return a[Math.floor(Math.random() * a.length)]; }
function nongSvg(mood, size) {
  const M = {
    happy:  ['M70 40v7', 'M94 40v7', 'm-eye', 'M76 56q6 7 12 0', 'm-line'],
    wink:   ['M70 40v7', 'M89 45q5-6 10 0', 'm-eye', 'M75 55q7 10 14 0z', 'm-solid'],
    search: ['M75 38v7', 'M99 38v7', 'm-eye', 'M84 58a3 3 0 1 0 0.1 0', 'm-line'],
    sad:    ['M70 42v6', 'M94 42v6', 'm-eye', 'M75 61q7-7 14 0', 'm-line'],
    sweat:  ['M70 41v6', 'M94 41v6', 'm-eye', 'M75 59q3.5-4 7 0t7 0', 'm-line', '<path class="m-drop" d="M125 12Q133 25 125 31Q117 25 125 12Z"/>'],
    sleepy: ['M64 45q6 4 12 0', 'M88 45q6 4 12 0', 'm-line', 'M79 58q3 2.5 6 0', 'm-line', '<path class="m-line" d="M116 6h9l-9 10h9"/>'],
    party:  ['M64 46q6-7 12 0', 'M88 46q6-7 12 0', 'm-line', 'M74 54q8 12 16 0z', 'm-solid'],
    offline:['M66 40l8 8m0-8l-8 8', 'M90 40l8 8m0-8l-8 8', 'm-line', 'M77 58h10', 'm-line']
  };
  const m = M[mood] || M.happy, w = size || 96;
  return `<svg class="nong" viewBox="0 0 140 110" width="${w}" height="${Math.round(w * 110 / 140)}" aria-hidden="true">
    <path class="m-speed" d="M6 34h18M2 48h20M10 62h12"/>
    <path class="m-body" d="M62 10H102A28 28 0 0 1 130 38V54A28 28 0 0 1 102 82H68L46 101L50 79Q34 72 34 54V38A28 28 0 0 1 62 10Z"/>
    <ellipse class="m-cheek" cx="58" cy="58" rx="6.5" ry="4"/><ellipse class="m-cheek" cx="106" cy="58" rx="6.5" ry="4"/>
    <path class="${m[2]}" d="${m[0]}"/><path class="${m[2]}" d="${m[1]}"/><path class="${m[4]}" d="${m[3]}"/>${m[5] || ''}</svg>`;
}
let loadTick = 0;
function loadingHtml() {
  return `<div class="loading"><div class="bowl">${nongSvg(NONG_MOOD[loadTick % NONG_MOOD.length])}</div><div class="shadow"></div>
    <div class="msg">${NONG_PROM.load[loadTick % NONG_PROM.load.length]}</div><div class="dots"><span></span><span></span><span></span></div></div>
    <div class="skel s2"></div><div class="skel"></div><div class="skel s3"></div>`;
}
setInterval(() => {
  const b = document.querySelector('.loading .bowl'), m = document.querySelector('.loading .msg');
  if (!b) return;
  loadTick++;
  b.innerHTML = nongSvg(NONG_MOOD[loadTick % NONG_MOOD.length]);
  m.textContent = NONG_PROM.load[loadTick % NONG_PROM.load.length];
}, 1100);
{ const b0 = document.querySelector('.loading .bowl'); if (b0) b0.innerHTML = nongSvg('happy'); }
document.getElementById('mark').innerHTML = nongSvg('happy', 40);
function emptyCard(mood, title, sub) {
  return `<div class="card hero"><div class="hm">${nongSvg(mood, 110)}</div><h2 style="margin:0">${title}</h2>${sub ? `<div class="muted">${sub}</div>` : ''}</div>`;
}

// ---------- เริ่มต้น ----------
boot();
async function boot() {
  if (API_URL.indexOf('__') === 0) return fatal('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html (คู่มือติดตั้ง ขั้นที่ 4)');
  if (!LIFF_ID || LIFF_ID.indexOf('__') === 0) {
    try { LIFF_ID = (await (await fetch(API_URL + '?config=1')).json()).liffId || ''; }
    catch (e) { return fatal('ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ API_URL และการ Deploy (คู่มือติดตั้ง ขั้นที่ 3 และ 4)'); }
    if (!LIFF_ID) return fatal('ยังไม่ได้ใส่ LIFF_ID ใน Script Properties (คู่มือติดตั้ง ขั้นที่ 5)');
  }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) return fatal('ไม่ได้รับ ID token — เปิด scope "openid" ในหน้า LIFF ของ LINE Developers');
  } catch (e) { return fatal('เปิด LIFF ไม่สำเร็จ: ' + e.message); }
  await refresh(true);
  setInterval(() => { if (!document.hidden && !anyBusy() && !editing()) refresh(); }, 90000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anyBusy() && !editing()) refresh(); });
}
function fatal(msg) {
  document.getElementById('app').innerHTML = `<div class="card hero"><div class="hm">${nongSvg('sad', 110)}</div><pre>${esc(msg)}</pre></div>`;
  document.getElementById('who').textContent = 'เปิดไม่สำเร็จ';
}

// ---------- คุยกับเซิร์ฟเวอร์ ----------
async function api(action, extra) {
  const body = JSON.stringify(Object.assign({ action, idToken, shop: SHOP }, extra || {}));
  const res = await fetch(API_URL + '?api=1', { method: 'POST', body });   // text/plain → ไม่ต้อง preflight
  const j = await res.json();
  if (j && j.auth) {
    if (!sessionStorage.getItem('reauth')) { sessionStorage.setItem('reauth', '1'); location.reload(); }
    throw new Error(j.error || 'ยืนยันตัวตนไม่ผ่าน');
  }
  sessionStorage.removeItem('reauth');
  return j;
}
async function refresh(first) {
  try {
    const j = await api('state');
    if (j && j.noShop) { IS_ADMIN = !!j.admin; NO_SHOP = j; S = null; if (tab !== 'admin') renderNoShop(); else renderAdmin(); return; }
    if (!j.ok) throw new Error(j.error || 'โหลดไม่สำเร็จ');
    NO_SHOP = null;
    setState(j);
  } catch (e) {
    if (first) fatal('โหลดข้อมูลไม่สำเร็จ: ' + e.message + '\nลองปิดแล้วเปิดใหม่');
    else toast('⚠️ เน็ตไม่เสถียร — ตัวเลขอาจยังไม่อัปเดต', 'warn');
  }
}
function setState(j) {
  S = j;
  IS_ADMIN = !!j.admin;
  if (j.shop && j.shop.id && j.shop.id !== SHOP) rememberShop(j.shop.id);
  if (tab !== 'admin') render(); else adminButton();
}

/**
 * ทำงาน 1 ปุ่ม: บันทึกเบื้องหลัง ไม่ล็อกจอ · rid เดิมเมื่อส่งซ้ำ → เซิร์ฟเวอร์บันทึกครั้งเดียว
 * (แบบเดียวกับแอปลงเวลาโคตรพร้อม)
 */
async function act(action, extra, key) {
  key = key || action;
  if (busy[key]) return null;
  const rid = pendingRid(key);
  busy[key] = true;
  rerender();
  let res = null, lastErr = null;
  for (let i = 0; i < 3 && !res; i++) {
    try { res = await api(action, Object.assign({ rid }, extra || {})); }
    catch (e) { lastErr = e; await sleep(1000 * (i + 1) * (i + 1)); }
  }
  busy[key] = false;
  if (!res) {
    rerender();
    toast('📶 ' + nong('offline') + '\nกดปุ่มเดิมอีกครั้งได้เลย ระบบจะไม่บันทึกซ้ำ\n(' + (lastErr ? lastErr.message : '') + ')', 'bad', 9000);
    return null;
  }
  clearPending(key);
  if (res.ok) moreOpen = '';
  if (res.state && res.state.ok) { S = res.state; }
  rerender();
  if (res.text) toast(res.text + '\n' + (res.ok ? nong('ok') : nong('error')), res.ok ? 'ok' : 'bad', res.ok ? 6000 : 9000);
  else if (res.error) toast(res.error + '\n' + nong('error'), 'bad', 9000);
  if (res.ok && res.share) shareToGroup(res.share);
  return res;
}
function rerender() { if (tab === 'admin') renderAdmin(); else render(); }
function pendingRid(key) {
  const k = 'kps.rid:' + key, p = load(k, null);
  if (p && Date.now() - p.at < 10 * 60000) return p.rid;
  const rid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^\w-]/g, '');
  store(k, { rid, at: Date.now() });
  return rid;
}
function clearPending(key) { store('kps.rid:' + key); }
function anyBusy() { return Object.keys(busy).some(k => busy[k]); }
function editing() { const a = document.activeElement; return !!a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- ตัวช่วย ----------
function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function baht(n) { return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 }); }
function qty(n) { return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 }); }
function num(v) { const s = String(v === undefined || v === null ? '' : v).replace(/,/g, '').trim(); return s === '' ? '' : (isFinite(+s) ? +s : NaN); }
function toast(text, kind, ms) {
  const el = document.getElementById('toast');
  el.className = kind || '';
  el.innerHTML = `<pre>${esc(text)}</pre>`;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, ms || 6000);
  el.onclick = () => { el.style.display = 'none'; };
}
/** ปุ่มอันตราย: แตะครั้งแรก = ขอยืนยัน · ครั้งที่สองภายใน 6 วินาที = ทำจริง (ห้ามใช้ confirm()) */
function twoTap(id, fn) {
  if (armed === id) { armed = ''; clearTimeout(armTimer); fn(); return; }
  armed = id;
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = ''; rerender(); }, 6000);
  rerender();
}
let moreOpen = '';
function moreBtn(id, label) {
  const on = moreOpen === id;
  return `<button class="more-btn${on ? ' on' : ''}" data-more="${esc(id)}" aria-label="ตัวเลือกเพิ่มเติม" aria-expanded="${on}">${label ? esc(on ? 'ปิด' : label) : ''}
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>`;
}
function moreBox(id, html) { return moreOpen === id && html ? `<div class="more-box">${html}</div>` : ''; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-more]');
  if (!b) return;
  moreOpen = moreOpen === b.dataset.more ? '' : b.dataset.more;
  armed = '';
  rerender();
});
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('ก๊อปแล้วน้า~ ไปวางในแชทได้เลย', 'ok', 3000); }
  catch (e) { toast('ก๊อปเองได้เลย:\n' + t, 'warn', 9000); }
}
let qrLib = null;
function drawQr(el, text) {
  if (!el || !text) return;
  const go = () => { el.innerHTML = ''; new QRCode(el, { text, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); };
  if (window.QRCode) return go();
  if (!qrLib) qrLib = new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = ok; sc.onerror = no; document.head.appendChild(sc);
  });
  qrLib.then(go).catch(() => { el.innerHTML = '<div class="muted" style="font-size:14px">โหลด QR ไม่ได้ ใช้ลิงก์แทน</div>'; });
}
const $ = id => document.getElementById(id);
const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
const itemById = id => (S.items || []).filter(i => i.id === id)[0];
const supById = id => (S.sups || []).filter(s => s.id === id)[0];
function match(i, q) { q = String(q || '').trim(); return !q || i.name.indexOf(q) >= 0 || i.cat.indexOf(q) >= 0; }
function buyTxt(i) { return i.buyUnit && i.buyUnit !== i.unit ? `${i.buyUnit} (= ${qty(i.per)} ${i.unit})` : i.unit; }

/** ดาวน์โหลดไฟล์ (คอมพิวเตอร์) · ในไลน์บางเครื่องโหลดไม่ได้ → แนะนำเปิดในคอม */
function download(name, text) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('ดาวน์โหลด ' + name + ' แล้วน้า~\nถ้าในไลน์โหลดไม่ได้ ให้เปิดลิงก์ร้านในคอมพิวเตอร์', 'ok', 6000);
  } catch (e) { toast('ดาวน์โหลดไม่ได้ ลองเปิดในคอมพิวเตอร์น้า', 'bad'); }
}
/** ย่อรูปบิลบนมือถือก่อนส่ง (ด้านยาวสุด 1280px) → ประหยัดเน็ตและพื้นที่ไดรฟ์ */
function shrinkImage(file) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => no(new Error('อ่านรูปไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}
function openLink(url) {
  try { if (liff.isInClient()) return liff.openWindow({ url, external: false }); } catch (e) {}
  window.open(url, '_blank', 'noopener');
}

// ---------- แจ้งในกลุ่มร้าน (liff.sendMessages ในนามคนกด — ไม่ใช่ push ของบอท · ไม่มีตัวเลขเงิน) ----------
let pendingShare = load('kps.pendingShare', '');
function inGroup() { try { const c = liff.getContext(); return !!c && (c.type === 'group' || c.type === 'room'); } catch (e) { return false; } }
async function shareToGroup(text) {
  if (!text || !inGroup()) return;
  try {
    if (!liff.isApiAvailable('sendMessages')) throw new Error('ส่งข้อความจากหน้านี้ไม่ได้');
    await liff.sendMessages([{ type: 'text', text: text.slice(0, 4900) }]);
    pendingShare = ''; store('kps.pendingShare');
  } catch (e) {
    pendingShare = text; store('kps.pendingShare', text);
    toast('📣 บันทึกแล้ว แต่ส่งแจ้งในกลุ่มไม่สำเร็จ\nกด "ส่งแจ้งอีกครั้ง" ได้เลย', 'warn', 8000);
  }
  rerender();
}
function pendingShareCard() {
  return pendingShare ? `<div class="card"><div class="note warn" style="margin-top:0">📣 ยังไม่ได้แจ้งในกลุ่ม<br><span style="font-size:15px">${esc(pendingShare.split('\n')[0])}</span></div>
    <button class="small-btn" id="bShare" style="width:100%;margin-top:10px">📣 ส่งแจ้งอีกครั้ง</button></div>` : '';
}

// ---------- โครงหน้าจอ ----------
const ICON = {
  count: 'M9 3h6v3H9zM7 4.5H5v16.5h14V4.5h-2M8.5 13l2.5 2.5 4.5-5',
  recv: 'M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9',
  waste: 'M4 7h16M9.5 7V4h5v3M6 7l1.2 13.5h9.6L18 7M10 11v6M14 11v6',
  order: 'M3 4h2.5l2.2 10.5h10.6L20.5 7H6.3M9 19.5a1.2 1.2 0 1 0 0.1 0M17 19.5a1.2 1.2 0 1 0 0.1 0',
  more: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7',
  boss: 'M5.5 8a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6'
};
function adminButton() {
  const b = $('adminBtn');
  b.hidden = !IS_ADMIN;
  b.textContent = tab === 'admin' ? 'กลับร้าน' : 'แอดมิน';
  b.onclick = () => {
    armed = ''; moreOpen = '';
    if (tab === 'admin') { tab = 'count'; if (S) render(); else if (NO_SHOP) renderNoShop(); else refresh(); }
    else { tab = 'admin'; adm = { view: 'home' }; renderAdmin(); loadAdmin(); }
  };
}
let skipSetup = false;
function render() {
  adminButton();
  if (tab === 'admin') return renderAdmin();
  if (!S) return;
  $('title').textContent = S.shop.name + ' · โคตรพร้อม สต็อก';
  if (!S.registered) { $('who').textContent = 'ยินดีต้อนรับ'; return renderRegister(); }
  $('who').textContent = 'สวัสดี ' + S.me.name;
  const tabs = [['count', 'นับของ'], ['recv', 'รับของ'], ['waste', 'ทิ้งของ'], ['order', 'สั่งของ'], ['more', 'อื่นๆ']];
  if (S.me.boss) tabs.push(['boss', 'จัดการ']);
  if (tab === 'boss' && !S.me.boss) tab = 'count';
  const ordered = {};
  S.orders.forEach(o => { if (o.status !== 'รับแล้ว') o.lines.forEach(l => { ordered[l.id] = 1; }); });
  const lowN = S.items.filter(i => i.low && !ordered[i.id]).length, waitN = S.orders.filter(o => o.status === 'รออนุมัติ').length;
  const nav = $('tabs');
  nav.hidden = false;
  document.body.classList.add('hasnav');
  nav.innerHTML = tabs.map(t => {
    const badge = t[0] === 'order' && (lowN || (S.me.boss && waitN)) ? `<span class="badge">${S.me.boss && waitN ? waitN : lowN}</span>` :
                  t[0] === 'more' && S.incoming ? `<span class="badge">${S.incoming}</span>` : '';
    return `<button class="${tab === t[0] ? 'on' : ''}" data-tab="${t[0]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[t[0]]}"/></svg>${t[1]}${badge}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; armed = ''; moreOpen = ''; render(); window.scrollTo(0, 0);
    if (tab === 'boss') loadBoss();
    if (tab === 'more') loadMore();
  });
  const app = $('app');
  if (S.setup && S.me.boss && !skipSetup && tab !== 'boss') return renderSetup(app);
  if (tab === 'count') renderCount(app);
  else if (tab === 'recv') renderRecv(app);
  else if (tab === 'waste') renderWaste(app);
  else if (tab === 'order') renderOrder(app);
  else if (tab === 'more') renderMore(app);
  else renderBoss(app);
  on('bShare', () => shareToGroup(pendingShare));
}

// ---------- นับของ (แบบ Food Market Hub: นับทีละหมวด · จำที่นับค้างไว้ · ส่งรวมทีเดียว) ----------
let countCat = '';
const countKey = () => 'kps.count:' + SHOP;
function renderCount(app) {
  const items = S.items;
  if (!items.length) { app.innerHTML = pendingShareCard() + emptyCard('search', 'ยังไม่มีของให้นับน้า~', 'ให้เจ้าของร้านใส่ของในร้านก่อน'); return; }
  const draft = load(countKey(), {});
  Object.keys(draft).forEach(id => { if (!itemById(id)) delete draft[id]; });
  const cats = groupsOf(items), gk = groupKey();
  if (cats.indexOf(countCat) < 0) countCat = cats[0];
  const done = Object.keys(draft).length;
  const chip = c => { const all = items.filter(i => gk(i) === c), n = all.filter(i => i.id in draft).length;
    return `<button data-cat="${esc(c)}" class="${countCat === c ? 'on' : ''}">${esc(c)} <i>${n}/${all.length}</i></button>`; };
  const rows = items.filter(i => gk(i) === countCat).map(i => `<div class="citem">
      <div class="main"><div class="name">${esc(i.name)} ${i.low ? '<span class="pill warn">ใกล้หมด</span>' : ''}</div>
        <div class="sub">นับเป็น ${esc(i.unit)}${S.me.boss && i.qty !== undefined && !i.fresh ? ` · ในระบบ ${qty(i.qty)}` : ''}</div></div>
      <div class="step"><button data-dn="${esc(i.id)}" aria-label="ลด ${esc(i.name)}">−</button>
        <input inputmode="decimal" data-q="${esc(i.id)}" value="${esc(draft[i.id] === undefined ? '' : draft[i.id])}" class="${i.id in draft ? 'done' : ''}" aria-label="จำนวน ${esc(i.name)}" placeholder="–">
        <button data-up="${esc(i.id)}" aria-label="เพิ่ม ${esc(i.name)}">+</button></div></div>`).join('');
  app.innerHTML = pendingShareCard() + `
    ${S.lastCount ? `<div class="muted center" style="margin-bottom:8px">นับล่าสุด ${esc(S.lastCount.at)} โดย ${esc(S.lastCount.by)}</div>` : ''}
    <div class="chips" id="cChips">${cats.map(chip).join('')}</div>
    <div class="card clist" style="padding:4px 16px">${rows}</div>
    <button class="btn" id="cGo" ${done && !busy.count ? '' : 'disabled'}>${busy.count ? '<span class="busy">กำลังส่ง</span>' : done ? `ส่งผลนับ ${done} รายการ` : 'ใส่จำนวนที่นับได้ก่อน'}<small>นับทีละหมวด แล้วส่งรวมทีเดียวได้ · ระบบจำที่นับค้างไว้ให้</small></button>
    <div class="more center">${moreBtn('cnt', 'เพิ่มเติม')}</div>${moreBox('cnt', `<button class="btn quiet" id="cPrint" style="margin:0 0 10px">🖨️ พิมพ์ใบนับ<small>นับบนกระดาษ แล้วมากรอกทีหลัง</small></button>` +
      (done ? `<button class="btn quiet${armed === 'clr' ? ' confirm' : ''}" id="cClr" style="margin:0">${armed === 'clr' ? 'แตะอีกครั้ง ล้างจริง' : 'ล้างที่นับค้างไว้'}</button>` : ''))}`;
  const save = () => {
    store(countKey(), draft);
    const n = Object.keys(draft).length, go = $('cGo');
    go.disabled = !n || busy.count;
    go.innerHTML = (n ? `ส่งผลนับ ${n} รายการ` : 'ใส่จำนวนที่นับได้ก่อน') + '<small>นับทีละหมวด แล้วส่งรวมทีเดียวได้ · ระบบจำที่นับค้างไว้ให้</small>';
    $('cChips').innerHTML = cats.map(chip).join('');
    wireChips();
  };
  const setQ = (id, v, el) => {
    const n = num(v);
    if (n === '' || isNaN(n) || n < 0) delete draft[id]; else draft[id] = Math.round(n * 100) / 100;
    if (el) el.classList.toggle('done', id in draft);
    save();
  };
  const wireChips = () => app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { countCat = b.dataset.cat; renderCount(app); });
  wireChips();
  app.querySelectorAll('[data-q]').forEach(el => el.oninput = () => setQ(el.dataset.q, el.value, el));
  const bump = (id, d) => {
    const el = app.querySelector(`[data-q="${id}"]`), cur = num(el.value);
    const v = Math.max(0, (cur === '' || isNaN(cur) ? 0 : cur) + d);
    el.value = String(Math.round(v * 100) / 100);
    setQ(id, el.value, el);
  };
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => bump(b.dataset.up, 1));
  app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => bump(b.dataset.dn, -1));
  on('cGo', async () => {
    const lines = Object.keys(draft).map(id => ({ id, qty: draft[id] }));
    const r = await act('count', { lines });
    if (r && r.ok) store(countKey());
    rerender();
  });
  on('cClr', () => twoTap('clr', () => { store(countKey()); moreOpen = ''; render(); }));
  on('cPrint', printCountSheet);
}
/** จัดหน้านับตาม "หมวด" หรือ "ที่เก็บ" (เจ้าของตั้งได้) — FMH นับตามจุดเก็บของ */
function groupKey() { return S.countBy === 'ที่เก็บ' ? i => i.loc || 'ไม่ระบุที่เก็บ' : i => i.cat; }
function groupsOf(items) {
  const gk = groupKey(), order = S.countBy === 'ที่เก็บ' ? S.locs.concat(['ไม่ระบุที่เก็บ']) : S.cats, out = [];
  order.concat(items.map(gk)).forEach(g => { if (out.indexOf(g) < 0 && items.some(i => gk(i) === g)) out.push(g); });
  return out;
}
function printCountSheet() {
  const gk = groupKey();
  $('print').innerHTML = `<h1>ใบนับสต็อก · ${esc(S.shop.name)}</h1><div>วันที่ ______________ ผู้นับ ______________</div>` +
    groupsOf(S.items).map(g => `<h2>${esc(g)}</h2><table><tr><th>ของ</th><th>หน่วย</th><th>นับได้</th><th>หมายเหตุ</th></tr>${
      S.items.filter(i => gk(i) === g).map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td class="box"></td><td class="box"></td></tr>`).join('')}</table>`).join('');
  window.print();
}

// ---------- ตัวเลือกของ (ค้นหา) ใช้ร่วม: รับของ · ทิ้งของ · สั่งของ · สูตร ----------
function pickerHtml(id, ph) {
  return `<input id="${id}" placeholder="${esc(ph || 'พิมพ์ชื่อของ เช่น หมู')}" autocomplete="off" style="width:100%"><div class="results" id="${id}R"></div>`;
}
function wirePicker(id, onPick, skip) {
  const inp = $(id), out = $(id + 'R');
  if (!inp) return;
  const draw = () => {
    const q = inp.value.trim();
    if (!q) { out.innerHTML = ''; return; }
    const list = S.items.filter(i => match(i, q) && !(skip && skip(i))).slice(0, 8);
    out.innerHTML = list.length ? list.map(i => `<button data-pk="${esc(i.id)}"><span>${esc(i.name)}</span><small>${esc(i.cat)} · ${esc(i.unit)}</small></button>`).join('')
                                : '<div class="muted" style="padding:8px 4px">ไม่เจอ ลองพิมพ์คำอื่นน้า</div>';
    out.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { inp.value = ''; out.innerHTML = ''; onPick(itemById(b.dataset.pk)); });
  };
  inp.oninput = draw;
}

// ---------- รับของ ----------
let rcv = null;   // { order, sup, lines:[{id, qty, price}] }
function renderRecv(app) {
  if (!rcv) {
    const open = S.orders.filter(o => o.status === 'อนุมัติ' || o.status === 'ส่งแล้ว');
    app.innerHTML = pendingShareCard() + (open.length ? `<div class="card"><h2>📦 รอรับของ ${open.length} ใบ</h2><div class="list">${open.map(o => `
        <div class="item"><div class="main"><div class="name">${esc(o.supName || 'ยังไม่ระบุร้านค้า')}</div>
          <div class="sub">${esc(o.no)} · ${o.lines.length} รายการ · ${esc(o.at)}</div></div>
          <button class="small-btn" data-ro="${esc(o.no)}">รับของ</button></div>`).join('')}</div></div>`
        : emptyCard('happy', 'ยังไม่มีใบสั่งที่รอรับของ', 'ของมาส่งโดยไม่มีใบสั่ง กดปุ่มด้านล่างได้เลยน้า'))
      + `<button class="btn quiet" id="rFree">รับของนอกใบสั่ง<small>ซื้อจากตลาด · ของมาส่งเอง</small></button>`;
    app.querySelectorAll('[data-ro]').forEach(b => b.onclick = () => startRecv(S.orders.filter(o => o.no === b.dataset.ro)[0]));
    on('rFree', () => { rcv = { order: '', sup: '', lines: [] }; renderRecv(app); });
    return;
  }
  const seeP = S.me.seePrice;
  const lines = rcv.lines.map((l, k) => {
    const i = itemById(l.id);
    if (!i) return '';
    return `<div class="rline"><div class="top"><b>${esc(i.name)}</b>${rcv.order ? '' : `<button class="x" data-rx="${k}" aria-label="เอาออก">✕</button>`}</div>
      <div class="in"><div><label>ได้กี่ ${esc(i.buyUnit)}</label><input inputmode="decimal" data-rq="${k}" value="${esc(l.qty)}"></div>
      ${seeP ? `<div><label>ราคาต่อ ${esc(i.buyUnit)} (บาท)</label><input inputmode="decimal" data-rp="${k}" value="${esc(l.price)}" placeholder="${i.price ? esc(qty(i.price * i.per)) : ''}"></div>` : ''}</div>
      ${i.buyUnit !== i.unit ? `<div class="muted" style="font-size:14px;margin-top:4px">1 ${esc(i.buyUnit)} = ${qty(i.per)} ${esc(i.unit)}</div>` : ''}</div>`;
  }).join('');
  app.innerHTML = `<div class="card">
      <div class="row" style="flex-wrap:nowrap"><h2 style="flex:1;margin:0">${rcv.order ? 'รับของตามใบ ' + esc(rcv.order) : 'รับของนอกใบสั่ง'}</h2>
        <button class="small-btn ghost" id="rBack">ยกเลิก</button></div>
      ${rcv.order ? `<div class="muted">${esc((supById(rcv.sup) || {}).name || '')} · แก้จำนวนให้ตรงกับของที่ได้จริง</div>` :
        `<div class="field" style="margin:10px 0 0"><label for="rSup">ร้านค้า (ไม่ใส่ก็ได้)</label><select id="rSup"><option value="">— ไม่ระบุ —</option>
          ${S.sups.map(s => `<option value="${esc(s.id)}" ${rcv.sup === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`}</div>
    ${lines}
    ${rcv.order ? '' : `<div class="card"><h2>＋ เพิ่มของที่ได้รับ</h2>${pickerHtml('rPick')}</div>`}
    <div class="card"><h2>🧾 บิลจากร้านค้า <span class="muted" style="font-size:15px">(ไม่ใส่ก็ได้)</span></h2>
      <div class="two"><div class="field"><label for="rBill">เลขที่บิล</label><input id="rBill" value="${esc(rcv.bill || '')}" maxlength="30"></div>
      ${seeP ? `<div class="field"><label for="rTotal">ยอดตามบิล (บาท)</label><input id="rTotal" inputmode="decimal" value="${esc(rcv.total || '')}"></div>` : ''}</div>
      <label class="small-btn ghost" style="display:inline-flex;align-items:center;cursor:pointer">📷 ${rcv.photo ? 'ถ่ายใหม่' : 'ถ่ายรูปบิล'}<input type="file" id="rPhoto" accept="image/*" capture="environment" hidden></label>
      ${rcv.photo ? `<img class="photo" src="${rcv.photo}" alt="รูปบิล">` : ''}
      ${seeP ? '<div class="muted" style="font-size:15px;margin-top:8px">ยอดบิลไม่ตรงกับระบบ น้องพร้อมจะเตือน · บิลไปรอจ่ายที่ จัดการ → บิล</div>' : ''}</div>
    <button class="btn" id="rGo" ${rcv.lines.length && !busy.receive ? '' : 'disabled'}>${busy.receive ? '<span class="busy">กำลังบันทึก</span>' : `รับเข้า ${rcv.lines.length} รายการ`}<small>${seeP ? 'ราคาที่ใส่ = ต้นทุนใหม่ของของชิ้นนั้น' : 'บันทึกจำนวนที่ได้จริง'}</small></button>`;
  on('rBack', () => { rcv = null; renderRecv(app); });
  const sup = $('rSup'); if (sup) sup.onchange = () => { rcv.sup = sup.value; };
  $('rBill').oninput = () => { rcv.bill = $('rBill').value; };
  const tot = $('rTotal'); if (tot) tot.oninput = () => { rcv.total = tot.value; };
  $('rPhoto').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try { rcv.photo = await shrinkImage(f); renderRecv(app); } catch (err) { toast('อ่านรูปไม่ได้ ลองถ่ายใหม่น้า', 'bad'); }
  };
  app.querySelectorAll('[data-rq]').forEach(el => el.oninput = () => { rcv.lines[+el.dataset.rq].qty = el.value; });
  app.querySelectorAll('[data-rp]').forEach(el => el.oninput = () => { rcv.lines[+el.dataset.rp].price = el.value; });
  app.querySelectorAll('[data-rx]').forEach(b => b.onclick = () => { rcv.lines.splice(+b.dataset.rx, 1); renderRecv(app); });
  wirePicker('rPick', i => { rcv.lines.push({ id: i.id, qty: '', price: '' }); renderRecv(app); const ins = app.querySelectorAll('[data-rq]'); if (ins.length) ins[ins.length - 1].focus(); },
             i => rcv.lines.some(l => l.id === i.id));
  on('rGo', async () => {
    for (const l of rcv.lines) {
      const q = num(l.qty), p = num(l.price), i = itemById(l.id);

    }
    const t = num(rcv.total);
    if (isNaN(t) || t < 0) return toast('ยอดตามบิลไม่ถูกต้อง', 'bad');
    const r = await act('receive', { order: rcv.order, sup: rcv.sup, lines: rcv.lines.map(l => ({ id: l.id, qty: num(l.qty), price: num(l.price) })),
                                     invoice: { no: rcv.bill || '', total: t, photo: rcv.photo || '' } });
    if (r && r.ok) rcv = null;
    rerender();
  });
}
function startRecv(o) {

  tab = 'recv';
  render();
  window.scrollTo(0, 0);
}

// ---------- ทิ้งของ ----------
let wst = null;   // { id, qty, reason }
function renderWaste(app) {
  if (!S.items.length) { app.innerHTML = emptyCard('search', 'ยังไม่มีของในร้านน้า~'); return; }
  if (!wst) {
    app.innerHTML = pendingShareCard() + `<div class="card"><h2>🗑️ ทิ้งอะไร?</h2>${pickerHtml('wPick', 'พิมพ์ชื่อของที่จะทิ้ง')}</div>
      <div class="muted center">ของเสีย หมดอายุ ทำหก — จดไว้ จะรู้ว่าเงินหายไปตรงไหน</div>`;
    wirePicker('wPick', i => { wst = { id: i.id, qty: '', reason: S.reasons[0] || '' }; renderWaste(app); });
    return;
  }
  const i = itemById(wst.id);
  if (!i) { wst = null; return renderWaste(app); }
  app.innerHTML = `<div class="card hero"><div class="hm">${nongSvg('sweat', 90)}</div><h2 style="margin:0">${esc(i.name)}</h2>
      <div class="muted">ทิ้งกี่ ${esc(i.unit)}</div>

    <div class="card"><h2>เพราะอะไร</h2><div class="types">${S.reasons.map(r => `<button data-wr="${esc(r)}" class="${wst.reason === r ? 'on' : ''}">${esc(r)}</button>`).join('')}</div></div>

    <button class="btn quiet" id="wBack">เลือกของอื่น</button>`;

    if (n === '' || isNaN(n) || n <= 0) return toast('ใส่จำนวนที่ทิ้งก่อนน้า', 'bad');
    const r = await act('waste', { id: wst.id, qty: n, reason: wst.reason });
    if (r && r.ok) wst = null;
    rerender();
  });
}

  toast('ก๊อปใบสั่งแล้ว ไปวางในแชทร้านค้า\nแล้วกด ⋯ → "ทำเครื่องหมายว่าส่งแล้ว" น้า~', 'warn', 9000);

async function loadBoss() {
  const k = bossTab, key = k === 'cost' ? 'sum' : k;

    sum: () => api('summary', { days: sumDays }), cost: () => api('summary', { days: sumDays }), team: () => api('team'),
    report: () => api('report', repRng), sales: () => api('salesGet', { date: salesDate || dayTH() }),
    bills: () => api('grnList', { unpaid: billsUnpaid }), hist: () => api('history', Object.assign({ type: histType }, histRng)),

  const r = bossCache[key];
  if (r && r.ok && k === 'report' && !repRng.from) repRng = { from: r.from, to: r.to };
  if (r && r.ok && k === 'hist' && !histRng.from) histRng = { from: r.from, to: r.to };
  if (r && r.ok && k === 'sales') salesDraft = salesFrom(r);
  if (tab === 'boss' && bossTab === k && !editing()) render();
}

function salesFrom(r) {
  const lines = r.menus.map(m => { const x = r.lines.filter(l => l.menu === m.menu)[0]; return { menu: m.menu, price: m.price, qty: x ? String(x.qty) : '', amount: x && x.amount !== null ? String(x.amount) : '' }; });
  r.lines.forEach(l => { if (!lines.some(x => x.menu === l.menu)) lines.push({ menu: l.menu, price: null, qty: String(l.qty), amount: l.amount === null ? '' : String(l.amount) }); });
  return { date: r.date, lines };
}
function parseSales(text) {
  const out = [], errs = [];
  String(text || '').split('\n').forEach((line, i) => {
    const t = line.trim().split(/[\s,\t]+/).filter(String);
    if (!t.length) return;
    const nums = []; while (t.length > 1 && /^\d+(\.\d+)?$/.test(t[t.length - 1].replace(/,/g, '')) && nums.length < 2) nums.unshift(t.pop().replace(/,/g, ''));
    if (!nums.length) { errs.push('บรรทัด ' + (i + 1) + ' ยังไม่มีจำนวน'); return; }
    out.push({ menu: t.join(' '), qty: nums[0], amount: nums[1] || '' });
  });
  return { out, errs };
}

        <div class="muted">${esc(g.no)} · ${esc(g.at)} · ${esc(g.by)}${g.order ? ' · ' + esc(g.order) : ''}${g.bill ? ' · บิล ' + esc(g.bill) : ''}</div></div></div>
      ${r.seePrice ? `<div class="flow"><span>มูลค่าตามระบบ</span><b>${moneyCell(g.sys)}</b></div>${g.billTotal !== null ? `<div class="flow"><span>ยอดตามบิล</span><b>${moneyCell(g.billTotal)}</b></div>` : ''}
        ${Math.abs(diff) >= 1 ? `<div class="note warn" style="margin-top:6px">บิลต่างจากระบบ ${diff > 0 ? '+' : ''}${baht(diff)} บาท</div>` : ''}` : ''}

function wireBossMore(app, val) {
  const reload = k => () => { bossCache[k] = null; render(); loadBoss(); };
  if (bossTab === 'report') {
    wireRange(app, 'rp', repRng, reload('report'));
    app.querySelectorAll('[data-csv]').forEach(b => b.onclick = async () => {
      try { const r = await api('exportCsv', Object.assign({ kind: b.dataset.csv }, repRng)); if (r.ok) download(r.name, r.csv); else toast(r.error, 'bad'); }
      catch (e) { toast('📶 ' + nong('offline'), 'bad'); }
    });
  }
  if (bossTab === 'hist') {
    wireRange(app, 'hs', histRng, reload('hist'));
    const t = $('hsType'); if (t) t.onchange = () => { histType = t.value; reload('hist')(); };
  }
  if (bossTab === 'bills') {
    app.querySelectorAll('[data-bu]').forEach(b => b.onclick = () => { billsUnpaid = b.dataset.bu === '1'; reload('bills')(); });
    app.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => openLink(b.dataset.ph));
    app.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => { const r = await act('grnPay', { no: b.dataset.pay, paid: true }, 'pay' + b.dataset.pay); if (r && r.ok) reload('bills')(); });
    app.querySelectorAll('[data-unpay]').forEach(b => b.onclick = () => twoTap('up' + b.dataset.unpay, async () => { const r = await act('grnPay', { no: b.dataset.unpay, paid: false }, 'pay'); if (r && r.ok) reload('bills')(); }));
  }
  if (bossTab === 'branch') on('brTr', () => { tab = 'more'; mx = { mode: 'transfer', to: S.branches[0].id, note: '', lines: [] }; render(); });
  if (bossTab === 'sales' && salesDraft) {
    const d = $('slDate');
    d.onchange = () => { salesDate = d.value; salesDraft = null; reload('sales')(); };
    app.querySelectorAll('[data-sq]').forEach(el => el.oninput = () => { salesDraft.lines[+el.dataset.sq].qty = el.value; });
    app.querySelectorAll('[data-sa]').forEach(el => el.oninput = () => { salesDraft.lines[+el.dataset.sa].amount = el.value; });
    app.querySelectorAll('[data-sx]').forEach(b => b.onclick = () => { salesDraft.lines.splice(+b.dataset.sx, 1); render(); });
    on('slAdd', () => { const m = val('slNew').trim(); if (!m) return; if (!salesDraft.lines.some(l => l.menu === m)) salesDraft.lines.push({ menu: m, price: null, qty: '', amount: '' }); render(); });
    on('slPasteGo', () => {
      const p = parseSales(val('slPaste'));
      if (p.errs.length) return toast(p.errs.join('\n'), 'bad', 8000);
      p.out.forEach(x => { const l = salesDraft.lines.filter(y => y.menu === x.menu)[0]; if (l) { l.qty = x.qty; l.amount = x.amount; } else salesDraft.lines.push({ menu: x.menu, price: null, qty: x.qty, amount: x.amount }); });
      moreOpen = ''; render(); toast('เติม ' + p.out.length + ' เมนูแล้ว กดบันทึกด้านล่างน้า~', 'ok', 4000);
    });
    on('slGo', async () => {
      const lines = salesDraft.lines.filter(l => String(l.qty).trim() !== '').map(l => ({ menu: l.menu, qty: num(l.qty), amount: num(l.amount) }));
      if (lines.some(l => isNaN(l.qty) || isNaN(l.amount))) return toast('ช่องตัวเลขใส่ได้แค่ตัวเลขน้า', 'bad');
      const r = await act('salesSave', { date: salesDate || dayTH(), lines }, 'sales');
      if (r && r.ok) reload('sales')();
    });
  }
}

// ---------- อื่นๆ: ทำของเตรียม · รับของโอน · คืนของร้านค้า · โอนให้สาขา ----------
let mx = null, trCache = null;   // mx = หน้าที่กำลังทำ { mode: produce|return|transfer, ... }
async function loadMore() {
  if (!S.branches.length && !S.incoming) { trCache = { ok: true, list: [] }; return; }
  try { trCache = await api('transfers'); } catch (e) { trCache = { ok: false, error: '📶 โหลดไม่สำเร็จ' }; }
  if (tab === 'more' && !mx) render();
}
function lineEditor(lines, unitOf, extra) {
  return lines.map((l, k) => {
    const i = itemById(l.id);
    if (!i) return '';
    return `<div class="rline"><div class="top"><b>${esc(i.name)}</b><button class="x" data-mx="${k}" aria-label="เอาออก">✕</button></div>
      <div class="row" style="flex-wrap:nowrap"><span class="muted" style="flex:1">กี่ ${esc(unitOf(i))}${extra ? extra(i) : ''}</span>
      <input inputmode="decimal" data-mq="${k}" value="${esc(l.qty)}" style="width:110px;text-align:right;font-weight:700"></div></div>`;
  }).join('');
}
function wireLines(app, lines, redraw) {
  app.querySelectorAll('[data-mq]').forEach(el => el.oninput = () => { lines[+el.dataset.mq].qty = el.value; });
  app.querySelectorAll('[data-mx]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.mx, 1); redraw(); });

      <div class="muted">${esc(t.no)} · ${esc(t.at)} · ${esc(t.by)}${t.receiver ? ' → ' + esc(t.receiver) : ''}</div></div></div>
      <div class="muted" style="margin-top:6px">${t.lines.map(l => `${esc(l.name)} ${qty(l.qty)} ${esc(l.unit)}`).join(' · ')}</div>
      ${t.dir === 'in' && t.status === 'ส่งแล้ว' ? `<button class="small-btn" data-tri="${esc(t.no)}" style="width:100%;margin-top:10px">📦 รับของโอน</button>` : ''}
      ${t.dir === 'out' && t.status === 'ส่งแล้ว' && boss ? `<button class="small-btn red${armed === 'trc' + t.no ? ' confirm' : ''}" data-trc="${esc(t.no)}" style="width:100%;margin-top:10px">${armed === 'trc' + t.no ? 'แตะอีกครั้ง ยกเลิกโอน' : 'ยกเลิกโอน'}</button>` : ''}</div>`;
  app.innerHTML = pendingShareCard() +
    (inc.length ? `<h2 style="font-family:var(--display);margin:4px 4px 10px">🚚 ของโอนเข้า</h2><div class="wide">${inc.map(trCard).join('')}</div>` : '') +

      : `<div class="muted">ยังไม่มีของที่ทำเองในร้าน${boss ? ' — ตั้งได้ที่ จัดการ → ของในร้าน → เลือกของ → "ทำเองในร้าน"' : ''}</div>`}</div>` +

function renderProduce(app) {
  const i = itemById(mx.id);
  if (!i || !i.prep) { mx = null; return renderMore(app); }
  const q = num(mx.qty), k = q && !isNaN(q) ? q / i.prep.yield : 0;
  app.innerHTML = `<div class="card hero"><div class="hm">${nongSvg('happy', 90)}</div><h2 style="margin:0">ทำ${esc(i.name)}</h2>
      <div class="muted">ได้กี่ ${esc(i.unit)} (สูตรละ ${qty(i.prep.yield)} ${esc(i.unit)})</div>
      <div class="step" style="justify-content:center;margin-top:12px"><button id="pDn" aria-label="ลด">−</button><input inputmode="decimal" id="pQ" value="${esc(mx.qty)}" placeholder="0" aria-label="จำนวนที่ทำได้"><button id="pUp" aria-label="เพิ่ม">+</button></div></div>
    <div class="card"><h2>ใช้วัตถุดิบ</h2><div class="list" id="pUse">${prodUse(i, k)}</div></div>
    <button class="btn" id="pGo" ${busy.produce ? 'disabled' : ''}>${busy.produce ? '<span class="busy">กำลังบันทึก</span>' : 'บันทึกการทำ'}<small>ตัดวัตถุดิบ แล้วเพิ่ม${esc(i.name)}เข้าสต็อก</small></button>
    <button class="btn quiet" id="pBack">กลับ</button>`;

      <h2 style="margin:4px 0 0;font-size:26px">สร้างร้านเสร็จแล้ว!</h2><div style="font-weight:700">${esc(r.shop.name)}${r.items ? ` · ของตั้งต้น ${r.items} อย่าง` : ''}</div></div>
    <div class="card"><div class="row" style="flex-wrap:nowrap;align-items:center;gap:14px">${r.link ? '<div class="qr" id="qrBox"></div>' : ''}
      <div style="min-width:0"><div class="muted" style="font-weight:700">รหัสร้าน</div><div class="bigcode">${esc(id)}</div>
        <div class="muted" style="font-weight:700;margin-top:6px">รหัสลงทะเบียน</div><div class="bigcode" style="font-size:28px">${esc(r.code)}</div></div></div>
      ${r.link ? `<div class="row" style="margin-top:12px;flex-wrap:nowrap"><input value="${esc(r.link)}" readonly style="flex:1;min-width:0"><button class="small-btn" id="dCopy">ก๊อป</button></div>` : '<div class="note warn">ยังไม่ได้ตั้ง LIFF_ID — ลิงก์ยังสร้างไม่ได้</div>'}</div>
    <div class="card"><h2>เหลืออีก 2 อย่าง (ทำในไลน์)</h2>
      <div class="ck"><b class="n">1</b><div>ส่งลิงก์ + รหัส <code>${esc(r.code)}</code> ให้ ${esc(r.owner)} (เจ้าของร้าน) แตะแล้วเลือกชื่อตัวเอง</div></div>
      <div class="ck"><b class="n">2</b><div>เจ้าของเพิ่มทีมงานในแอป แล้วส่งลิงก์เดียวกันในกลุ่มร้าน · เปิดแอปจากในกลุ่ม ทุกคนจะเห็นตอนนับ/รับของ</div></div></div>
    <button class="btn" id="dOpen">เปิดร้านนี้ (ช่วยตั้งของให้)</button><div class="gap"></div>
    <button class="btn quiet" id="dHome">กลับหน้าร้านทั้งหมด</button>`;
  drawQr($('qrBox'), r.link);
  on('dCopy', () => copyText(`ลิงก์ร้าน ${r.shop.name}\n${r.link}\nรหัสลงทะเบียน ${r.code}`));
  on('dOpen', () => openShop(id));
  on('dHome', () => { adm = { view: 'home' }; renderAdmin(); loadAdmin(); });
}
</script>
</body>
